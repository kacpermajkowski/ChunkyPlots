# You should define a prefix, as it's used not only for prefixing messages
# See use-message-prefix below if you don't want your messages to use a prefix
prefix: "&e&lChunkyPlots"

# Used to globally disable or enable prefixing plugin messages
use-message-prefix: true
# Prefix spacer is placed between prefix and message sent by the plugin
prefix-spacer: " &8&l» &7"

# Determines where the interaction messages will be sent to the player.
# CHAT - simply shows the messages in the chat
# ACTIONBAR - message will pop up as small text above the hotbar
# BOSSBAR - message will show up at the top as dragon's HP bar
# Write out all the options you want active, comma-separated within the braces
interaction-message-display: [ACTIONBAR]

plot-item:
  material: "NOTE_BLOCK"
  name: "&6&lBLOK DZIALKI"
  lore:
    - "&7Ten blok umozliwi ci zajecie chunku"
    - "&7tak, aby nikt obcy nie mogl"
    - "&7zniszczyc ci dzialki"

# Permission and group plot count limits
plot-limits:
  # Default limit for players without special permissions
  default: 1
  # Group-based plot limits (integrated with Vault if installed)
  groups:
    default: 1
    vip: 5
    svip: 10
    mvp: 20

# Swiaty, w ktorych mozna tworzyc dzialki oraz ich unikalne aliasy
# Domyslnie: "world" = "", "world_nether" = "nether", "world_end" = "end"
# Aliasy musza byc unikalne!
worlds:
  world: ""
  world_nether: "nether"
  world_end: "end"

# Granice wysokosci dzialek (poziom Y)
# Domyslnie dzialka chroni tylko od poziomu Y = 0 w gore (wszystko ponizej Y < 0 nie jest chronione).
plot-height:
  # Dolna granica ochrony dzialki (domyslnie 0).
  # Wszystko ponizej tego poziomu Y (np. jaskinie Y < 0) nie jest chronione.
  min-y: 0

  # Gorny limit wysokosci ochrony dzialki.
  # Wpisz liczbe (np. 320), aby wlaczyc limit, lub pozostaw 'disabled' / null / -1, aby wylaczyc gorny limit.
  max-y: null

# Ochrona przed wrastaniem struktur (drzewa, wielkie grzyby itp.) w obce dzialki
structure-overgrowth:
  # Jesli true: bloki wrastajace w obca dzialke nie wygeneruja sie (zostana wyciete),
  # a reszta drzewa wyrosnie normalnie w obrebie Twojej dzialki.
  # Jesli false: wzrost calego drzewa jest anulowany, gdy choc jeden blok wrasta w obca dzialke.
  dont-generate-overgrowing-blocks: false

  # W przypadku anulowania wzrostu drzewa (gdy wrasta):
  # true = sadzonka wypada jako przedmiot na ziemie, a blok sadzonki znika.
  # false = sadzonka pozostaje nienaruszona w ziemi.
  drop-sapling-on-fail: true
